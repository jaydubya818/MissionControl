name: Enterprise contract checkpoint

on:
  push:
    branches: [codex/enterprise-factory-orchestration]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @mission-control/shared test
      - run: pnpm run typecheck
      - name: Native factory regressions
        run: >-
          pnpm exec vitest run
          convex/__tests__/factoryAttempt.test.ts
          convex/__tests__/factoryConfiguration.test.ts
          convex/__tests__/factoryDispatch.test.ts
          convex/__tests__/factoryRuntimeGoldenPath.test.ts
          convex/__tests__/missionWorkOrderContract.test.ts
          convex/__tests__/missionGovernance.test.ts
      - run: node scripts/skill-lint.mjs
