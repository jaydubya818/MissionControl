name: Capability control component qualification

on:
  push:
    branches: [codex/unified-capability-control-plane]
  pull_request:
    paths:
      - packages/capability-control/**
      - .github/workflows/capability-control.yml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '${{ matrix.node }}'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile --filter @mission-control/capability-control...
      - run: pnpm --filter @mission-control/capability-control typecheck
      - run: pnpm --filter @mission-control/capability-control test

  admission-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run ci:prepare
      - run: pnpm exec tsc --noEmit -p convex/tsconfig.json
      - run: pnpm exec vitest run convex/__tests__/capabilityAdmission.test.ts convex/__tests__/capabilityAdmissionBoundaries.test.ts convex/__tests__/workOrderDispatch.test.ts
