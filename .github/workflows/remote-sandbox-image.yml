name: Remote Sandbox Image Candidate

on:
  push:
    branches:
      - codex/remote-sandbox-hardening-v1
    paths:
      - infra/remote-sandbox/**
      - .github/workflows/remote-sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/jaydubya818/mission-control-remote-sandbox

jobs:
  build-scan-publish:
    name: Build, scan, and publish candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact linux/amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: infra/remote-sandbox
          file: infra/remote-sandbox/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:restricted-candidate-${{ github.sha }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}:restricted-candidate-${{ github.sha }}
          format: spdx-json
          output-file: remote-sandbox-image.spdx.json
          upload-artifact: false

      - name: Reject High or Critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ env.IMAGE_NAME }}:restricted-candidate-${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: remote-sandbox-vulnerabilities.json

      - name: Preserve supply-chain gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-sandbox-supply-chain-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            remote-sandbox-image.spdx.json
            remote-sandbox-vulnerabilities.json

      - name: Verify frozen toolchain and publish image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:restricted-candidate-${GITHUB_SHA}"
          observed_node="$(docker run --rm --entrypoint node "$image" --version)"
          observed_codex="$(docker run --rm --entrypoint codex "$image" --version)"
          codex_sha="$(docker run --rm --entrypoint sh "$image" -c 'cat /etc/mission-control/codex-binary.sha256')"
          toolchain_inputs_sha="$(docker run --rm --entrypoint sh "$image" -c 'cat /etc/mission-control/toolchain-inputs.sha256')"
          test "$observed_node" = "v26.7.0"
          test "$observed_codex" = "codex-cli 0.146.0"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r '.digest')"
          test -n "$digest"
          test "$digest" != "null"
          repo_digest="${IMAGE_NAME}@${digest}"
          sbom_sha="$(sha256sum remote-sandbox-image.spdx.json | awk '{print $1}')"
          jq -n \
            --arg schema "mission-control-remote-image-provenance/v1" \
            --arg image "$repo_digest" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg node "$observed_node" \
            --arg codex "$observed_codex" \
            --arg codexSha256 "sha256:$codex_sha" \
            --arg toolchainInputsSha256 "sha256:$toolchain_inputs_sha" \
            --arg sbomSha256 "sha256:$sbom_sha" \
            '{schema:$schema,image:$image,sourceSha:$sourceSha,nodeVersion:$node,codexVersion:$codex,codexBinarySha256:$codexSha256,toolchainInputsSha256:$toolchainInputsSha256,sbomSha256:$sbomSha256}' \
            >remote-sandbox-image-provenance.json
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Attest pushed image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Upload immutable build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-sandbox-image-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            remote-sandbox-image.spdx.json
            remote-sandbox-vulnerabilities.json
            remote-sandbox-image-provenance.json
