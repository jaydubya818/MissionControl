name: CI — Mission Control

on:
  push:
    branches: [main, master, 'feat/*', 'bugfix/*', 'sf/*']
  pull_request:
    branches: [main, master, 'sf/*']

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      
      - name: Install Python dependencies
        run: |
          pip install pyyaml
      
      - name: Run smoke test
        run: |
          ./scripts/mc-smoke.sh
        env:
          DRY_RUN: "true"

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      
      - name: Build shared packages
        run: |
          pnpm run ci:prepare

      - name: Smoke built orchestration artifact
        run: |
          pnpm --filter @mission-control/orchestration-server build
          pnpm --filter @mission-control/orchestration-server smoke:start
      
      - name: Run typecheck
        run: |
          pnpm run ci:typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      
      - name: Run lint
        run: |
          pnpm run lint

      - name: Guard public Convex runtime contracts
        run: pnpm run ci:runtime-contract
        env:
          RUNTIME_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      # Fab permits Cellar/system check executables; setup-node's tool cache is outside that boundary.
      - name: Select Homebrew Node 24 for contained checks
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install node@24
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          /opt/homebrew/opt/node@24/bin/node -e 'const fs = require("node:fs"); const p = fs.realpathSync(process.execPath); if (process.platform !== "darwin" || process.arch !== "arm64" || !process.version.startsWith("v24.") || !p.startsWith("/opt/homebrew/Cellar/")) process.exit(1); console.log(JSON.stringify({version:process.version, path:p, sha256:require("node:crypto").createHash("sha256").update(fs.readFileSync(p)).digest("hex")}));'

      # The worker deliberately scrubs PATH; expose only the action-provisioned pnpm there.
      - name: Provision pnpm for frozen offline worker checks
        run: |
          # Link the package entrypoint: the .bin shell shim resolves paths relative to $0.
          pnpm_entry="$PNPM_HOME/../pnpm/bin/pnpm.cjs"
          test -f "$pnpm_entry"
          ln -sf "$pnpm_entry" /opt/homebrew/bin/pnpm
          /opt/homebrew/bin/pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm run ci:prepare

      - name: Gate skill quality (minimum 80)
        run: |
          node scripts/skill-lint.mjs --min-score 80

      - name: Run unit tests
        run: |
          pnpm run ci:test

  eval-integrity:
    name: Eval Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run hermetic golden suite and negative controls
        run: pnpm run eval:mission-control

  build:
    name: Build (UI + workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run ci:prepare

      - name: Build UI
        run: pnpm --filter mission-control-ui build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # E2E requires a live Convex backend — run but don't block merges if infra unavailable
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build shared packages
        run: pnpm run ci:prepare

      - name: Run E2E tests
        run: pnpm run ci:test:e2e
        env:
          CI: true

  release-security:
    name: Release Security Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Enforce dependency and credential policy
        run: pnpm run release:security
        env:
          AUTHORIZATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  browser-security:
    name: Browser Security and Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deterministic browser and accessibility gates
        run: pnpm run test:e2e:critical
        env:
          CI: true

  system-qualification-v2:
    name: System Qualification V2
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      # Fab permits Cellar/system check executables; setup-node's tool cache is outside that boundary.
      - name: Select Homebrew Node 24 for contained checks
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install node@24
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          /opt/homebrew/opt/node@24/bin/node -e 'const fs = require("node:fs"); const p = fs.realpathSync(process.execPath); if (process.platform !== "darwin" || process.arch !== "arm64" || !process.version.startsWith("v24.") || !p.startsWith("/opt/homebrew/Cellar/")) process.exit(1); console.log(JSON.stringify({version:process.version, path:p, sha256:require("node:crypto").createHash("sha256").update(fs.readFileSync(p)).digest("hex")}));'

      # The worker deliberately scrubs PATH; expose only the action-provisioned pnpm there.
      - name: Provision pnpm for frozen offline worker checks
        run: |
          # Link the package entrypoint: the .bin shell shim resolves paths relative to $0.
          pnpm_entry="$PNPM_HOME/../pnpm/bin/pnpm.cjs"
          test -f "$pnpm_entry"
          ln -sf "$pnpm_entry" /opt/homebrew/bin/pnpm
          /opt/homebrew/bin/pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run complete composed qualification
        run: pnpm run qualify:factory:v2
        env:
          CI: true
          MC_QUALIFICATION_EVIDENCE_SLUG: fab-phase3-ci
