name: CI — Mission Control

on:
  push:
    branches: [main, master, 'feat/*', 'bugfix/*', 'sf/*']
  pull_request:
    branches: [main, master, 'sf/*']

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install Python dependencies
        run: |
          pip install pyyaml
      
      - name: Run smoke test
        run: |
          ./scripts/mc-smoke.sh
        env:
          DRY_RUN: "true"

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install dependencies
        run: |
          pnpm install
      
      - name: Build shared packages
        run: |
          pnpm run ci:prepare
      
      - name: Run typecheck
        run: |
          pnpm run ci:typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install dependencies
        run: |
          pnpm install
      
      - name: Run lint
        run: |
          pnpm run lint

      - name: Guard public Convex runtime contracts
        run: pnpm run ci:runtime-contract
        env:
          RUNTIME_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build shared packages
        run: |
          pnpm run ci:prepare

      - name: Gate skill quality (minimum 80)
        run: |
          node scripts/skill-lint.mjs --min-score 80

      - name: Run unit tests
        run: |
          pnpm run ci:test

  build:
    name: Build (UI + workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace packages
        run: pnpm run ci:prepare

      - name: Build UI
        run: pnpm --filter mission-control-ui build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # E2E requires a live Convex backend — run but don't block merges if infra unavailable
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build shared packages
        run: pnpm run ci:prepare

      - name: Run E2E tests
        run: pnpm run ci:test:e2e
        env:
          CI: true
